# Supabase mínimo para Novudent (servidor propio): Postgres + GoTrue (login) + PostgREST (API) + Realtime + Kong (puerta de entrada).
# Sin Studio, Analytics, Vector, Storage, Functions ni Supavisor: no se usan (spec del 9-oct §4) y cada uno es una superficie más.
#
# Se despliega en Coolify como «Docker Compose» desde Git (carpeta infra/supabase) y se prueba igual con `probar-local.sh`.
# Los secretos NO viven acá: Coolify genera las variables mágicas SERVICE_PASSWORD_* y SERVICE_SUPABASE*_KEY (ver docs/servidor/supabase.md);
# `probar-local.sh` genera las suyas, descartables, con los mismos nombres.
# Versiones FIJADAS (el conjunto que Supabase publica junto en su docker-compose oficial del 17-oct-2026). Actualizar siempre primero en el stack local.
#
# No publica ningún puerto al host: el único camino de entrada es Kong, y a Kong lo publica el proxy de Coolify con un dominio.

name: novudent-supabase

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
      # La clave de pgsodium se guarda acá: sin este volumen, un reinicio la regenera y lo cifrado deja de poder leerse.
      - db-config:/etc/postgresql-custom
      - ./volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      # Deben correr como superusuario (reasignan roles reservados).
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      # Evita que las consultas de sondeo de Realtime llenen el registro.
      - -c
      - log_min_messages=fatal

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${SERVICE_PASSWORD_POSTGRES}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      # OJO: con true GoTrue también rechaza la sesión ANÓNIMA (422) y la demo pública la necesita. Queda abierto el registro, pero un alta por
      # email sin confirmar no puede iniciar sesión (ENABLE_EMAIL_AUTOCONFIRM=false) y, sin membresía en una clínica, las reglas de datos
      # (RLS) no le dejan leer ni escribir nada fuera de cl_demo. Las cuentas reales las crea el servidor con la API de administración.
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${SERVICE_PASSWORD_JWT}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # La demo pública entra con sesión anónima.
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS:-true}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Novudent}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"

  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${SERVICE_PASSWORD_POSTGRES}@db:5432/postgres
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${SERVICE_PASSWORD_JWT}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ["postgrest"]

  realtime:
    image: supabase/realtime:v2.143.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        # Realtime saca el «tenant» del primer tramo del nombre de host (realtime-dev): Kong le habla con este nombre.
        aliases:
          - realtime-dev.supabase-realtime
    healthcheck:
      test: ["CMD-SHELL", "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer $${ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:-supabaserealtime}
      API_JWT_SECRET: ${SERVICE_PASSWORD_JWT}
      SECRET_KEY_BASE: ${SERVICE_PASSWORD_64_REALTIME}
      METRICS_JWT_SECRET: ${SERVICE_PASSWORD_JWT}
      ANON_KEY: ${SERVICE_SUPABASEANON_KEY}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  kong:
    image: kong/kong:3.9.1
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
      realtime:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/home/kong/kong-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      # https://github.com/supabase/cli/issues/14
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_PLUGINS: cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      SUPABASE_ANON_KEY: ${SERVICE_SUPABASEANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_SUPABASESERVICE_KEY}
    volumes:
      - ./volumes/api/kong.yml:/home/kong/temp.yml:ro
      - ./volumes/api/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro

volumes:
  db-data:
  db-config:
