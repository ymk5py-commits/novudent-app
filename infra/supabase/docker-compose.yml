# Supabase mínimo para Novudent (servidor propio): Postgres + GoTrue (login) + PostgREST (API) + Realtime + Kong (puerta de entrada).
# Sin Studio, Analytics, Vector, Storage, Functions ni Supavisor: no se usan (spec del 9-oct §4) y cada uno es una superficie más.
#
# Se despliega en Coolify como «Docker Compose» desde Git (carpeta infra/supabase) y se prueba igual con `probar-local.sh`.
# Los secretos NO viven acá: Coolify genera las variables mágicas SERVICE_PASSWORD_* y SERVICE_SUPABASE*_KEY (ver docs/servidor/supabase.md);
# `probar-local.sh` genera las suyas, descartables, con los mismos nombres.
# Versiones FIJADAS (el conjunto que Supabase publica junto en su docker-compose oficial del 17-oct-2026). Actualizar siempre primero en el stack local.
#
# No publica ningún puerto al host: el único camino de entrada es Kong, y a Kong lo publica el proxy de Coolify con un dominio.

name: novudent-supabase

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
      # La clave de pgsodium se guarda acá: sin este volumen, un reinicio la regenera y lo cifrado deja de poder leerse.
      - db-config:/etc/postgresql-custom
    configs:
      - source: db_realtime_sql
        target: /docker-entrypoint-initdb.d/migrations/99-realtime.sql
      # Deben correr como superusuario (reasignan roles reservados).
      - source: db_roles_sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
      - source: db_jwt_sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
      - source: db_hook_sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-zz-hook.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      # Evita que las consultas de sondeo de Realtime llenen el registro.
      - -c
      - log_min_messages=fatal

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${SERVICE_PASSWORD_POSTGRES}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      # OJO: con true GoTrue también rechaza la sesión ANÓNIMA (422) y la demo pública la necesita. Queda abierto el registro, pero un alta por
      # email sin confirmar no puede iniciar sesión (ENABLE_EMAIL_AUTOCONFIRM=false) y, sin membresía en una clínica, las reglas de datos
      # (RLS) no le dejan leer ni escribir nada fuera de cl_demo. Las cuentas reales las crea el servidor con la API de administración.
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${SERVICE_PASSWORD_JWT}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # La demo pública entra con sesión anónima.
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS:-true}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Novudent}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      # Hook «antes de crear un usuario»: solo pasan las sesiones anónimas (la demo) y las cuentas ya confirmadas (las crea el servidor con la API de
      # administración). Sin esto, con el registro abierto cualquiera con la clave pública podría reservar correos ajenos (cuentas sin confirmar) y
      # trabar el alta de una clínica real con ese correo. La función vive en db_hook_sql (se crea al inicializar la base).
      GOTRUE_HOOK_BEFORE_USER_CREATED_ENABLED: "true"
      GOTRUE_HOOK_BEFORE_USER_CREATED_URI: pg-functions://postgres/public/hook_antes_de_crear_usuario

  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${SERVICE_PASSWORD_POSTGRES}@db:5432/postgres
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${SERVICE_PASSWORD_JWT}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ["postgrest"]

  realtime:
    image: supabase/realtime:v2.143.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        # Realtime saca el «tenant» del primer tramo del nombre de host (realtime-dev): Kong le habla con este nombre.
        aliases:
          - realtime-dev.supabase-realtime
    healthcheck:
      test: ["CMD-SHELL", "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer $${ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:-supabaserealtime}
      API_JWT_SECRET: ${SERVICE_PASSWORD_JWT}
      SECRET_KEY_BASE: ${SERVICE_PASSWORD_64_REALTIME}
      METRICS_JWT_SECRET: ${SERVICE_PASSWORD_JWT}
      ANON_KEY: ${SERVICE_SUPABASEANON_KEY}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  kong:
    image: kong/kong:3.9.1
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
      realtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      # https://github.com/supabase/cli/issues/14
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_PLUGINS: cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      # Tope de lo que entra por la API: un documento de Novudent pesa menos de 1 MB (imágenes en base64 ya redimensionadas). Sin tope, cualquiera
      # con la clave pública (también la sesión anónima de la demo) podría mandar cuerpos enormes hasta el límite de Cloudflare (100 MB).
      KONG_NGINX_PROXY_CLIENT_MAX_BODY_SIZE: 8m
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
    configs:
      - source: kong_yml
        target: /home/kong/kong.yml
    # Explícito a propósito: Coolify conecta cada servicio a su red propia y, solo a los que declaran `networks`, también a «default». El alias
    # realtime-dev.supabase-realtime vive en «default»; sin esto Kong no lo resuelve (503 en el WebSocket de Realtime, visto el 17-oct).
    networks:
      - default

volumes:
  db-data:
  db-config:

# Archivos que antes eran bind mounts de ./volumes/**: Coolify reescribe esas rutas a /data/coolify/applications/<uuid>/volumes/** (sin la carpeta
# base), no las encuentra y Docker crea DIRECTORIOS vacíos en su lugar (los scripts de la base no corren y las contraseñas de los roles quedan sin fijar).
# Como `configs` con contenido en línea no depende de ninguna ruta del host, funciona igual en Coolify y con `docker compose` a secas.
# Ojo: dentro de un `content` compose interpola variables; un «$» literal se escribe «$$».
configs:
  db_realtime_sql:
    content: |
      \set pguser `echo "$$POSTGRES_USER"`

      create schema if not exists _realtime;
      alter schema _realtime owner to :pguser;

  db_roles_sql:
    content: |
      -- Contraseña de los roles que usan los servicios que SÍ corren (GoTrue y PostgREST); la de supabase_admin la fija la propia imagen.
      -- La versión oficial también toca pgbouncer, supabase_functions_admin y supabase_storage_admin: acá no se usan (y supabase_functions_admin
      -- ni siquiera existe sin webhooks.sql, así que la inicialización fallaba).
      \set pgpass `echo "$$POSTGRES_PASSWORD"`

      ALTER USER authenticator WITH PASSWORD :'pgpass';
      ALTER USER supabase_auth_admin WITH PASSWORD :'pgpass';

  db_jwt_sql:
    content: |
      \set jwt_exp `echo "$$JWT_EXP"`

      ALTER DATABASE postgres SET "app.settings.jwt_exp" TO :'jwt_exp';

  db_hook_sql:
    content: |
      -- Hook de GoTrue «before-user-created». Deja pasar (devuelve {}) solo a la sesión anónima y a las cuentas que ya nacen confirmadas (API de
      -- administración); rechaza con 403 el registro abierto por correo o teléfono. Solo GoTrue (supabase_auth_admin) puede ejecutarla: nunca por la API.
      create or replace function public.hook_antes_de_crear_usuario(event jsonb)
      returns jsonb
      language plpgsql
      stable
      set search_path = ''
      as $$$$
      begin
        if coalesce((event -> 'user' ->> 'is_anonymous')::boolean, false)
           or (event -> 'user' ->> 'email_confirmed_at') is not null then
          return '{}'::jsonb;
        end if;
        return jsonb_build_object('error', jsonb_build_object(
          'http_code', 403,
          'message', 'Las cuentas se crean desde Novudent: el registro abierto está cerrado.'));
      end $$$$;
      revoke execute on function public.hook_antes_de_crear_usuario(jsonb) from public, anon, authenticated;
      grant execute on function public.hook_antes_de_crear_usuario(jsonb) to supabase_auth_admin;

  kong_yml:
    content: |
      # Puerta de entrada de Novudent: solo auth, rest y realtime. Sin dashboard, storage, funciones ni analytics.
      # Cada ruta (salvo las abiertas de auth) exige la cabecera «apikey» con la clave anónima o la de servicio.
      # Compose interpola ${SERVICE_SUPABASEANON_KEY} y ${SERVICE_SUPABASESERVICE_KEY} al crear esta config.
      _format_version: '2.1'
      _transform: true

      consumers:
        - username: anon
          keyauth_credentials:
            - key: ${SERVICE_SUPABASEANON_KEY}
        - username: service_role
          keyauth_credentials:
            - key: ${SERVICE_SUPABASESERVICE_KEY}

      acls:
        - consumer: anon
          group: anon
        - consumer: service_role
          group: admin

      services:
        # --- Auth: enlaces de los correos y callbacks (sin clave) ---
        - name: auth-v1-open
          url: http://auth:9999/verify
          routes:
            - name: auth-v1-open
              strip_path: true
              paths:
                - /auth/v1/verify
          plugins:
            - name: cors
        - name: auth-v1-open-callback
          url: http://auth:9999/callback
          routes:
            - name: auth-v1-open-callback
              strip_path: true
              paths:
                - /auth/v1/callback
          plugins:
            - name: cors
        - name: auth-v1-open-authorize
          url: http://auth:9999/authorize
          routes:
            - name: auth-v1-open-authorize
              strip_path: true
              paths:
                - /auth/v1/authorize
          plugins:
            - name: cors

        # --- Auth: el resto, con clave ---
        - name: auth-v1
          url: http://auth:9999/
          routes:
            - name: auth-v1-all
              strip_path: true
              paths:
                - /auth/v1/
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        # --- API de datos (PostgREST) ---
        - name: rest-v1
          url: http://rest:3000/
          routes:
            - name: rest-v1-all
              strip_path: true
              paths:
                - /rest/v1/
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: true
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        # --- Tiempo real: WebSocket y API de Realtime. Se habla con el nombre realtime-dev.supabase-realtime (alias de red) porque Realtime
        #     saca el «tenant» del primer tramo del host. La ruta más larga (/realtime/v1/api) gana sobre /realtime/v1/ ---
        - name: realtime-v1-ws
          url: http://realtime-dev.supabase-realtime:4000/socket
          protocol: ws
          routes:
            - name: realtime-v1-ws
              strip_path: true
              paths:
                - /realtime/v1/
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon
        - name: realtime-v1-rest
          url: http://realtime-dev.supabase-realtime:4000/api
          protocol: http
          routes:
            - name: realtime-v1-rest
              strip_path: true
              paths:
                - /realtime/v1/api
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon
