# Recurso separado de Coolify; solo contadores de Novudent, sin datos clínicos.
services:
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
    command:
      - sh
      - -ec
      - |
        umask 077
        printf 'bind 0.0.0.0\nprotected-mode yes\nrequirepass %s\nmaxmemory 128mb\nmaxmemory-policy noeviction\nsave ""\nappendonly no\n' "$$REDIS_PASSWORD" > /tmp/novudent-redis.conf
        exec redis-server /tmp/novudent-redis.conf
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      app:
        aliases: [novudent-redis]
networks:
  app:
    name: coolify
    external: true
